name: Compilar app

# Se ejecuta cada vez que subes cambios a main, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar clave de TMDB
        run: |
          if [ -z "$TMDB_KEY" ]; then
            echo "::error::Falta el secreto TMDB_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Generar proyecto Android
        run: flutter create --project-name wheretosee --org com --platforms android .

      - name: Ajustar Android (permisos, nombre, firma)
        run: python3 tool/patch_android.py

      - name: Dependencias
        run: flutter pub get

      - name: Icono
        run: dart run flutter_launcher_icons

      - name: Revisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Firma de publicación configurada."
          else
            echo "::warning::Sin clave de firma: el APK sirve para probar, pero el .aab no se podrá subir a Play Store."
          fi

      - name: Número de versión
        run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Compilar APK (para instalar y probar en tu móvil)
        run: flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=TMDB_KEY="$TMDB_KEY"

      - name: Compilar AAB (para subir a Play Store)
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER --dart-define=TMDB_KEY="$TMDB_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-para-probar
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aab-para-play-store
          path: build/app/outputs/bundle/release/app-release.aab
